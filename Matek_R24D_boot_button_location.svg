<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e32636"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#f5f6f8"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Matek ELRS-R24-D — your photo orientation</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#526077">Component side facing you • antenna connectors on the left</text>

  <g filter="url(#shadow)">
    <path d="M350 205 H880 Q920 205 920 245 V650 Q920 690 880 690 H350 Q310 690 310 650 V245 Q310 205 350 205 Z" fill="#1769aa" stroke="#0c3f6b" stroke-width="8"/>
  </g>

  <!-- Antenna connectors, matching the user's photo orientation -->
  <g>
    <rect x="270" y="350" width="92" height="72" rx="12" fill="#d8a51d" stroke="#8b6610" stroke-width="7"/>
    <circle cx="316" cy="386" r="18" fill="#282521" stroke="#f0c84a" stroke-width="8"/>
    <rect x="270" y="505" width="92" height="72" rx="12" fill="#d8a51d" stroke="#8b6610" stroke-width="7"/>
    <circle cx="316" cy="541" r="18" fill="#282521" stroke="#f0c84a" stroke-width="8"/>
    <text x="218" y="391" text-anchor="end" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#303846">Upper antenna</text>
    <text x="218" y="546" text-anchor="end" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#303846">Lower antenna</text>
  </g>

  <!-- Boot tactile switch: directly above the upper IPEX connector -->
  <g>
    <rect x="283" y="264" width="66" height="44" rx="8" fill="#bcc3ca" stroke="#32383f" stroke-width="7"/>
    <rect x="291" y="272" width="49" height="28" rx="5" fill="#e7eaed"/>
    <circle cx="316" cy="286" r="8" fill="#292d31"/>
    <circle cx="316" cy="286" r="53" fill="none" stroke="#e32636" stroke-width="10"/>
  </g>

  <!-- Simplified landmarks only -->
  <circle cx="430" cy="360" r="22" fill="#ff273b" stroke="#9b0c19" stroke-width="7"/>
  <text x="430" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">LED</text>
  <rect x="505" y="330" width="180" height="180" rx="12" fill="#202833" stroke="#0d131b" stroke-width="7"/>
  <rect x="760" y="285" width="94" height="55" rx="7" fill="#d9d6c8" stroke="#77756d" stroke-width="6"/>
  <text x="807" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">silver crystal</text>
  <g fill="#d7aa32" stroke="#8d6c1c" stroke-width="4">
    <rect x="850" y="430" width="70" height="38"/><rect x="850" y="480" width="70" height="38"/><rect x="850" y="530" width="70" height="38"/><rect x="850" y="580" width="70" height="38"/>
  </g>
  <text x="820" y="652" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">G / 5V / TX / RX pads →</text>

  <path d="M790 185 C650 170 505 190 357 264" fill="none" stroke="#e32636" stroke-width="12" marker-end="url(#arrow)"/>
  <rect x="710" y="125" width="400" height="86" rx="14" fill="#e32636"/>
  <text x="910" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#ffffff">BOOT BUTTON</text>
  <text x="910" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">directly above upper gold connector</text>

  <rect x="105" y="724" width="990" height="50" rx="12" fill="#fff0c9" stroke="#e4b449" stroke-width="3"/>
  <text x="600" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#674b00">In your installed quad it is partly obscured by the black 3D-printed mount.</text>
</svg>
